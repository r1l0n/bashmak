# Личный /etc/resolv.conf для bashmak.service.
#
# Подкладывается в юнит через BindReadOnlyPaths и виден ТОЛЬКО боту:
# у сервиса своё пространство монтирования, системный файл не меняется.
#
# Зачем: иначе бот резолвит имена через systemd-resolved на 127.0.0.53, и
# работа DNS начинает зависеть от маршрутизации, от того, что resolved
# считает своим апстримом, и от строчки hosts: в /etc/nsswitch.conf. Со
# своим резолвером бот ходит в 1.1.1.1 через туннель — там, где и всё
# остальное его общение с Discord.
#
# Побочная польза: DNS-ответы приходят с той стороны туннеля, то есть их
# нельзя подменить по дороге.
#
# Работает это потому, что в nsswitch.conf стоит `hosts: files dns` —
# glibc читает именно этот файл. Если когда-нибудь там появится `resolve`,
# запросы пойдут в systemd-resolved мимо resolv.conf, и сюда придётся
# добавить подмену nsswitch.conf.

nameserver 1.1.1.1
nameserver 1.0.0.1
options timeout:3 attempts:2
