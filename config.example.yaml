# Конфигурация «Башмака». setup.sh копирует этот файл в config.yaml, если его
# ещё нет, и подставляет пути моделей согласно выбранному профилю (--profile).
# Все относительные пути считаются от корня проекта.

# Профиль, проставляется setup.sh: fast | balanced | quality | qwen
# Отличаются диалоговой моделью и размером STT, см. README.
profile: balanced

# ---------------------------------------------------------------------------
# Бюджет ядер (рассчитан на 12 физических)
#
# Считается пик одновременной работы, а не сумма. Этапы одной реплики идут
# последовательно, так что складывать надо только то, что реально пересекается.
#
#   обычный случай (говорит один):  7 генерации + 5 STT = 10
#   двое говорят, бот отвечает:     7 генерации + 3 STT = 10
#   разбор промпта:                 10 потоков коротким всплеском (threads_batch)
#
# Вторая строка перестала быть переподпиской при переходе на GigaAM: у whisper
# потоки задавались на воркера и вторым говорящим удваивались (7 + 6 = 13),
# у onnxruntime stt.gigaam.threads — общий пул на все распознавания сразу.
#
# Наращивать llm.threads выше 7 малополезно: генерация упирается в пропускную
# способность памяти, а не в вычисления, и отдача от потоков выходит на плато
# к шести-восьми. У разбора промпта это иначе — см. llm.threads_batch.
#
# При торможении на трёх и более говорящих снижать нужно llm.threads, а не
# stt: иначе распознавание перестаёт успевать и речь теряется в буферах.
# ---------------------------------------------------------------------------

discord:
  # Пусто = глобальные slash-команды (регистрируются до часа).
  # ID серверов в этом списке — команды появляются на них мгновенно.
  guild_ids: []
  # Выйти из голосового канала, если он пуст столько секунд (0 = не выходить).
  idle_leave_seconds: 900

audio:
  # Формат, в котором работают VAD и Whisper.
  #
  # Формат самого Discord (48 кГц, 2 канала, кадр 20 мс) здесь не задаётся: он
  # продиктован протоколом и настройкой быть не может. Он лежит константами в
  # bashmak/audio/resample.py и bashmak/output/arbiter.py.
  work_sample_rate: 16000

vad:
  # Порог вероятности речи (0..1). Выше — меньше ложных срабатываний, но режет тихую речь.
  threshold: 0.5
  # Сколько тишины считать концом фразы.
  #
  # Прямо входит в задержку ответа: столько бот молчит после того, как человек
  # договорил, и ещё +200 мс держит слушатель (Discord перестаёт слать пакеты,
  # когда человек замолчал, — тишины, по которой закрылась бы фраза, физически
  # не приходит). 700 было запасом «чтобы точно не резать»; 500 — обычная
  # рабочая точка для разговорного бота. Если фразы с задумчивыми паузами
  # начнут рваться пополам — поднимайте обратно, это тюнинг под живых людей.
  silence_ms: 500
  # Короче этого — мусор (кашель, стук по столу), выбрасываем.
  min_speech_ms: 300
  # Принудительно нарезать монолог, чтобы не копить бесконечный сегмент.
  max_segment_s: 20
  # Сколько аудио «до» срабатывания VAD дописать в начало сегмента,
  # чтобы не срезать первый слог.
  preroll_ms: 300
  # Размер окна Silero v5 для 16 кГц. Модель принимает только 512.
  window_samples: 512
  # Путь к весам VAD (качает setup.sh).
  model_path: models/vad/silero_vad.onnx

stt:
  # Движок распознавания: gigaam | whisper. Настройки каждого — в своей
  # подсекции ниже, так что переключение это ровно одна эта строка.
  #
  # gigaam — Conformer от SberDevices (240M весов, MIT). На русском точнее
  # whisper-medium и при этом дешевле whisper-small. Дело не в размере:
  # энкодер whisper всегда считает окно, дополненное до 30 секунд, поэтому
  # реплика на две секунды обходится у него почти как на двадцать. Conformer
  # считает фактическую длину, а в голосовом чате почти все реплики короткие.
  #
  # whisper — прежний движок, оставлен как путь отката. Веса от него, если их
  # не удалять, лежат рядом, и возврат не требует ни перекачивания, ни правки
  # чего-либо ещё.
  engine: gigaam

  gigaam:
    # Вариант модели. Суффикс e2e — с пунктуацией и нормализацией чисел; без
    # него текст приходит сплошной строчной лентой, и это видно по ответам ЛЛМ.
    #
    #   gigaam-v3-e2e-rnnt  точнее всех, WER около 3.3% против 15-20% у small
    #   gigaam-v3-e2e-ctc   немного проще и легче
    #   gigaam-v2-ctc       без пунктуации, зато всего два файла весов
    model: gigaam-v3-e2e-rnnt
    model_path: models/stt/gigaam-v3-e2e-rnnt
    # none | int8. int8 весит вчетверо меньше (226 МБ против 892 МБ) и считает
    # быстрее, но качество на своём звуке стоит сверить: разница видна не на
    # бенчмарке, а на сжатом Opus-ом микрофоне.
    quantization: none
    # Общий пул потоков onnxruntime на все одновременные распознавания разом.
    #
    # Это НЕ то же, что cpu_threads_per_worker у whisper. Там потоки считались
    # на воркера, и двое говорящих грузили машину вдвое сильнее одного. Здесь
    # значение — жёсткий потолок: сколько ядер STT заберёт в пике, независимо
    # от числа говорящих. Поэтому и бюджет ядер в шапке файла сошёлся.
    #
    # Три — столько же, сколько брал один воркер whisper, но теперь это потолок
    # на всех, а не на каждого. Если ядра есть, это первый рычаг для задержки:
    # поднимать до 6-8, сверяясь с бюджетом в шапке.
    threads: 5
    # Сколько фраз считается одновременно. Больше одной нужно, только когда
    # говорят двое сразу; ядер это не добавляет — они делят threads выше.
    workers: 2
    # Реплики с низкой уверенностью выбрасываем (обычно это шум). Шкала своя
    # у каждого движка, значение whisper сюда не переносится: здесь это среднее
    # по токенам, а тишину модель и так отдаёт пустой строкой.
    min_avg_logprob: -1.5

  whisper:
    model_path: models/stt/faster-whisper-small
    compute_type: int8
    language: ru
    # Число процессов-воркеров. STT CPU-bound, GIL обходится процессами.
    #
    # Три потока, а не два: в обычном случае говорит один человек и второй
    # воркер простаивает, так что третий поток берётся из ничего. Занятыми оба
    # воркера оказываются, только когда двое говорят одновременно.
    workers: 2
    cpu_threads_per_worker: 3
    # beam_size 1 = greedy, заметно быстрее на CPU при небольшой потере качества.
    beam_size: 1
    # Сегменты с низкой уверенностью выбрасываем (обычно это шум).
    min_avg_logprob: -1.0
    no_speech_threshold: 0.6
    # Подсказка Whisper: сильно повышает шанс, что имя бота распознается
    # как «Башмак», а не «башмаг»/«бошняк». У GigaAM аналога нет и не нужно —
    # имя он берёт правильно за счёт русского словаря.
    initial_prompt: "Разговор с ботом по имени Башмак."

wakeword:
  variants:
    - башмак
    - бошмак
    - башмачок
    - бащмак
    - башмачек
  # Порог rapidfuzz ratio (сравнение пословное), 0..100.
  threshold: 80
  # true = в LLM уходит только текст после имени, false = вся фраза.
  strip_prefix: true

intent:
  # Когда звать LLM для разбора намерения, если регекс не сработал:
  #   hinted — только если в реплике есть музыкальный намёк (по умолчанию);
  #   always — всегда (точнее, но +1 инференс к каждой реплике);
  #   never  — никогда, только регекс.
  llm_fallback: hinted

llm:
  server_url: http://127.0.0.1:8080
  # Формат промпта: gigachat | vikhr. Должен соответствовать llm.model_path.
  #
  # Промпт бот собирает сам и шлёт в /completion мимо чат-слоя llama.cpp (см.
  # bashmak/llm/client.py), поэтому разделители ролей — его забота, а у моделей
  # они разные. С чужим форматом модель не падает: она перестаёт видеть границы
  # ходов и дописывает диалог за всех участников. clean_reply() такой ответ
  # обрежет, но осмысленным он от этого не станет.
  prompt_format: vikhr
  # Vikhr-YandexGPT-5-Lite-8B: плотная, все 8 млрд весов считаются на каждый
  # токен. Замерено на целевой машине (llama-bench, 7 потоков): генерация
  # 10.6 tok/s, разбор промпта 65 tok/s.
  #
  # Взята не за скорость, а за характер: это дообучение поверх pretrain-базы
  # YandexGPT, без корпоративного выравнивания, и персона проходит без отказов.
  # Профиль gigachat в scripts/setup.sh никуда не делся — возврат это три ключа
  # здесь (model_path, prompt_format, temperature) и рестарт llama-server.
  model_path: models/llm/Vikhr-YandexGPT-5-Lite-8B-it-Q4_K_M.gguf
  # Потоки llama-server на генерацию (см. бюджет ядер в шапке файла).
  threads: 7
  # Потоки на разбор промпта (префилл). Пусто = столько же, сколько threads.
  #
  # Это два разных режима работы. Генерация упирается в пропускную способность
  # памяти и выходит на плато к шести-восьми потокам. Разбор промпта — обычное
  # матричное умножение, короткий всплеск на десятки-сотни токенов, и он
  # масштабируется по ядрам дальше. Отдавать ему все ядра почти бесплатно:
  # всплеск короткий, а на время ответа влияет напрямую.
  threads_batch: 10
  # Закрепить веса в памяти, не отдавая их под page cache. При 40 ГБ ОЗУ и
  # модели на 5–18 ГБ это бесплатно и исключает сценарий, где бот замолкает
  # на секунды: часть модели вытеснена и читается с диска посреди ответа.
  mlock: true
  # Модель поддерживает 131k, но столько не требуется: в промпт уходит
  # системная часть и несколько коротких ходов. Лишний контекст — лишняя
  # память.
  #
  # Делится между слотами llama-server, а их два (--parallel 2 в
  # scripts/run_llama_server.sh): 2048 на диалог и 2048 на классификатор
  # намерений. Обоим с запасом. Второй слот нужен не для параллельного счёта,
  # а чтобы два разных системных промпта не вытирали кеш префикса друг другу.
  context_size: 4096
  # Потолок генерации. Персона отвечает одним предложением, и всё сверх первого
  # предложения clean_reply() всё равно выбрасывает — то есть каждый лишний
  # токен здесь это потраченные впустую секунды CPU. Одно русское предложение —
  # 15–25 токенов (токенизаторы GigaChat и YandexGPT оба заточены под русский и
  # тратят на него примерно поровну), 48 оставляет запас на длинную фразу.
  # Поднимать только вместе с правкой персоны на многопредложенческие ответы.
  max_tokens: 48
  # Компромисс между двумя требованиями. Персоне нужна высокая температура: на
  # низкой она отвечает одними и теми же двумя-тремя заготовками, а бот
  # повторяется заметнее, чем ошибается. Карточка Vikhr, наоборот, просит
  # 0.1–0.5 и обещает артефакты генерации на 1.0 и выше.
  #
  # 0.6 — верх рекомендованного коридора с небольшим запасом. Если полезет
  # бессвязица или обрывки латиницы — снижать до 0.5. Если бот начнёт
  # повторяться — поднимать до 0.7 и слушать, что сломается первым.
  # С профилем gigachat здесь было 1.1, и артефактов не было.
  temperature: 0.6
  top_p: 0.95
  request_timeout_s: 120
  # Сколько обменов (вопрос + ответ) помнить. История общая на голосовой канал:
  # участники разговаривают с одним ботом и подхватывают чужие вопросы.
  # Больше трёх на CPU вредно: длинный контекст разбавляет вопрос, и модель
  # отвечает на фон, а не на заданное. 0 = без истории.
  history_turns: 3
  # Столько секунд тишины в канале — и разговор начинается с чистого листа.
  history_ttl_s: 120
  # Реплика, пролежавшая в очереди дольше, считается неактуальной.
  stale_task_s: 45

tts:
  # Silero TTS v5, русский. Ставит ударения, произносит «ё», снимает омографы.
  model_path: models/tts/v5_5_ru.pt
  # Мужские: aidar, eugene. Женские: baya, kseniya, xenia.
  speaker: aidar
  # 48000 совпало бы с частотой Discord, и ресемпла на выходе не было бы — но
  # вокодер на 48 кГц делает вдвое больше работы, чем на 24, а ресемпл тракт и
  # так умеет: OutputArbiter.speak() заводит StreamResampler(rate, 48000).
  # Апсемпл 24→48 стоит доли миллисекунды на кусок, синтез — сотни. Меняется
  # только это число, остальной тракт частоту берёт из ответа воркера.
  sample_rate: 24000
  put_accent: true
  put_yo: true
  # Омографы: «за́мок» или «замо́к» — по смыслу фразы, а не по первому попавшемуся
  # варианту. Появились в v5; на модели постарее воркер их молча отбросит.
  put_stress_homo: true
  put_yo_homo: true
  workers: 1
  # Потоки torch в каждом воркере. Остальные ядра нужны STT и llama-server.
  threads: 2

music:
  volume: 0.5
  # До какой громкости приглушать музыку, пока говорит бот.
  duck_volume: 0.25
  duck_fade_ms: 150
  # Сколько держать музыку приглушённой после того, как речь кончилась.
  # Реплика приходит кусками, и между ними буфер пустеет на доли секунды —
  # без удержания музыка на каждой паузе всплывает и снова ныряет.
  duck_hold_ms: 400
  max_queue: 20
  search_timeout_s: 20
  # Откуда брать трек, когда название не назвали: «Башмак, включи что-нибудь».
  # Это же вкус бота на радио (autoplay ниже).
  #
  # Строка — поисковый запрос, ссылка — плейлист YouTube целиком. Бот кидает
  # кубик дважды: сначала источник, потом трек из первых random_pool
  # результатов, — иначе на каждый запрос приезжала бы одна и та же первая
  # строка выдачи. Пустой список возвращает прежний ответ «скажи название».
  random_sources:
    - русский рок лучшее
    - русский рэп
    - хиты 90-х
    - зарубежный рок классика
    - lo-fi hip hop
  # Из скольких верхних результатов выдачи тянуть случайный. Больше — разнообразнее
  # и хуже: низ выдачи по запросу вроде «хиты 90-х» уходит в случайный шум.
  random_pool: 20
  # Доиграв последний трек в очереди, взять следующий случайный. false — тишина.
  #
  # Радио заводится только после команды включить музыку и гаснет по «выключи
  # музыку»: само по себе, в тишине, оно не начинается.
  autoplay: true

logging:
  level: INFO
  file: logs/bashmak.log
  max_bytes: 10485760
  backup_count: 5
