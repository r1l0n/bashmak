# Конфиг «Башмака». setup.sh копирует этот файл в config.yaml, если его ещё нет,
# и подставляет пути моделей согласно выбранному профилю (--profile).
# Все относительные пути считаются от корня проекта.

# Профиль, проставляется setup.sh: fast | balanced | quality | qwen
# Отличаются диалоговой моделью и размером STT, см. README.
profile: balanced

# ---------------------------------------------------------------------------
# Бюджет ядер (рассчитан на 10 физических)
#
# Считать надо не сумму, а пик одновременной работы. Реально пересекаются
# только два процесса: llama-server отвечает, пока STT разбирает речь другого
# участника, — это 7 + 4 = 11 потоков на 10 ядер, лёгкая переподписка.
# TTS с LLM не пересекается: синтез начинается после того, как модель
# закончила, — так что его 2 потока живут за счёт освободившихся от LLM.
#
# Наращивать llm.threads выше 7 смысла мало: на CPU инференс упирается в
# пропускную способность памяти, а не в вычисления, и отдача от потоков
# выходит на плато уже к шести-восьми.
# ---------------------------------------------------------------------------

discord:
  # Пусто = глобальные slash-команды (регистрируются до часа).
  # Укажите ID своих серверов, чтобы команды появились мгновенно.
  guild_ids: []
  # Выйти из голосового канала, если он пуст столько секунд (0 = не выходить).
  idle_leave_seconds: 900

audio:
  # Формат, в котором Discord отдаёт декодированный PCM. Менять нельзя.
  discord_sample_rate: 48000
  discord_channels: 2
  # Формат, в котором работают VAD и Whisper.
  work_sample_rate: 16000
  # Длительность кадра Discord, мс. 20 мс = 3840 байт. Менять нельзя.
  frame_ms: 20

vad:
  # Порог вероятности речи (0..1). Выше — меньше ложных срабатываний, но режет тихую речь.
  threshold: 0.5
  # Сколько тишины считать концом фразы.
  silence_ms: 700
  # Короче этого — мусор (кашель, стук по столу), выбрасываем.
  min_speech_ms: 300
  # Принудительно нарезать монолог, чтобы не копить бесконечный сегмент.
  max_segment_s: 20
  # Сколько аудио «до» срабатывания VAD дописать в начало сегмента,
  # чтобы не срезать первый слог.
  preroll_ms: 300
  # Размер окна Silero v5 для 16 кГц. Модель принимает только 512.
  window_samples: 512
  # Путь к весам VAD (качает setup.sh).
  model_path: models/vad/silero_vad.onnx

stt:
  model_path: models/stt/faster-whisper-small
  compute_type: int8
  language: ru
  # Число процессов-воркеров. STT — CPU-bound, обходим GIL процессами.
  # Два воркера по два потока = четыре ядра под распознавание. Больше не
  # ставим: распознавание короткими рывками, а вот отнятые у llama-server
  # ядра удлиняют ответ на каждой реплике.
  workers: 2
  cpu_threads_per_worker: 2
  # beam_size 1 = greedy, заметно быстрее на CPU при небольшой потере качества.
  beam_size: 1
  # Сегменты с низкой уверенностью выбрасываем (обычно это шум).
  min_avg_logprob: -1.0
  no_speech_threshold: 0.6
  # Подсказка Whisper: сильно повышает шанс, что имя бота распознается
  # как «Башмак», а не «башмаг»/«бошняк».
  initial_prompt: "Разговор с ботом по имени Башмак."

wakeword:
  variants:
    - башмак
    - бошмак
    - башмачок
    - бащмак
    - башмачек
  # Порог rapidfuzz ratio (сравнение пословное), 0..100.
  threshold: 80
  # true = в LLM уходит только текст после имени, false = вся фраза.
  strip_prefix: true

intent:
  # Когда звать LLM для разбора намерения, если регекс не сработал:
  #   hinted — только если в реплике есть музыкальный намёк (по умолчанию);
  #   always — всегда (точнее, но +1 инференс к каждой реплике);
  #   never  — никогда, только регекс.
  llm_fallback: hinted

llm:
  server_url: http://127.0.0.1:8080
  # GigaChat-20B-A3B: MoE, ~3 млрд активных весов из 20. Файл 11.6 ГБ, и все
  # 11.6 держатся в памяти — считается-то малая часть, но лежать должна вся.
  model_path: models/llm/GigaChat-20B-A3B-instruct-v1.5-q4_K_M.gguf
  # Потоки llama-server (см. бюджет ядер в шапке файла).
  threads: 7
  # Держать веса в памяти намертво, не отдавая их под page cache. При 45 ГБ
  # ОЗУ и модели на 12–18 ГБ это бесплатно, зато исключает единственный
  # сценарий, где бот внезапно «задумывается» на секунды: часть модели
  # вытеснили, и её читают с диска посреди ответа.
  mlock: true
  # Модель умеет 131k, но нам столько не нужно: в промпт уходит системная
  # часть и несколько коротких ходов. Лишний контекст — только лишняя память.
  context_size: 4096
  max_tokens: 200
  temperature: 0.7
  top_p: 0.9
  request_timeout_s: 120
  # Сколько обменов (вопрос + ответ) помнить. История общая на голосовой канал:
  # люди в нём разговаривают с одним ботом и подхватывают чужие вопросы.
  # Больше трёх на CPU вредно — длинный контекст разбавляет вопрос, и модель
  # начинает отвечать на фон, а не на то, что спросили. 0 = без истории.
  history_turns: 3
  # Столько секунд тишины в канале — и разговор начинается с чистого листа.
  history_ttl_s: 120
  # Реплика, пролежавшая в очереди дольше, — уже неактуальна, выбрасываем.
  stale_task_s: 45

tts:
  # Silero TTS v4, русский. Ударения и «ё» — звучит заметно живее Piper.
  model_path: models/tts/v4_ru.pt
  # Мужские: aidar, eugene. Женские: baya, kseniya, xenia.
  speaker: aidar
  # 48000 совпадает с частотой Discord — пересэмплирование на выходе не нужно.
  sample_rate: 48000
  put_accent: true
  put_yo: true
  workers: 1
  # Потоки torch в каждом воркере. Остальные ядра нужны STT и llama-server.
  threads: 2

music:
  volume: 0.5
  # До какой громкости приглушать музыку, пока говорит бот.
  duck_volume: 0.25
  duck_fade_ms: 150
  max_queue: 20
  search_timeout_s: 20

logging:
  level: INFO
  file: logs/bashmak.log
  max_bytes: 10485760
  backup_count: 5
